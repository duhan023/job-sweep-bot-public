# Default schedule: 08:30 America/New_York (EDT), Monday-Friday.
# `python configure.py` overwrites this file with YOUR time zone and frequency.
# GitHub cron is UTC-only and has no DST awareness; re-run configure.py after a
# DST change if the exact local hour matters to you.
name: Daily Job Sweep

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job sweep
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python sweep_public.py

      - name: Commit updated job log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add areas/job-search-log.md
          if git diff --staged --quiet; then
            echo "No new roles to log."
          else
            git commit -m "chore: log dispatched roles ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
